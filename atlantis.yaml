version: 3
automerge: false
projects:
  - dir: .
    workflow: dev
    autoplan:
      enabled: true
      when_modified: ["*.tf", "*.tfvars", "atlantis.yaml"]
    apply_requirements: [approved, mergeable]

workflows:
  dev:
    plan:
      steps:
        - init
        - plan:
            extra_args: ["-var-file", "terraform.tfvars"]
    apply:
      steps:
        - apply
